[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hads-shap"
version = "1.0.0"
description = "Hierarchical auditing of SHAP attribution changes in correlated feature groups"
requires-python = ">=3.13,<3.14"
dependencies = [
  "numpy==2.3.5",
  "pandas==2.2.3",
  "scipy==1.17.0",
  "scikit-learn==1.8.0",
  "xgboost==3.1.3",
  "lightgbm==4.6.0",
  "shap==0.50.0",
  "matplotlib==3.10.8",
  "numba==0.65.1"
]

[tool.setuptools.packages.find]
where = ["src"]
